name: CI Pipeline
'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Nightly: the whole fleet suite in one run, as on main (#547).
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      slice_live_repeat:
        description: 'Times to run the live capped slice test (default: 1)'
        required: false
        default: '1'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Hooks, lints and the other suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # actions/checkout runs `git init`, which prints a hint while Git's
      # default branch name is unset.
      - name: Set Git's default branch name
        run: git config --global init.defaultBranch main
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Unit tests (ramp, countdown, reading age, multi-account rows)
        run: node --test src/*.test.js
      # The hook is the only path that publishes usage, so its fixtures cover
      # the shapes that would otherwise fail silently: absent rate_limits, a
      # second account, malformed stdin, an unwritable destination.
      - name: statusLine hook tests
        run: bash statusline/test_statusline.sh
      # Logging gates (techne's logging standard): pages log through
      # src/log.js, never console.log, and Python log calls take arguments.
      # Before the keryx checkout, and keryx/ excluded besides, so its files
      # never reach klepsydra's lints.
      - name: JS lint (Biome noConsole)
        run: npm run lint -- --reporter=github
      - name: Python lint (ruff, logging rules)
        run: pipx run ruff==0.17.3 check --output-format=github
      # The fleet hook is the only writer of a session's state, so its fixtures
      # cover the shapes that would otherwise show a wrong status.
      # keryx names a session's repo the same way the fleet hook does; with
      # its source checked out the parity cases run instead of skipping.
      - name: Checkout keryx (parity source)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ajbarea/keryx
          path: keryx
          persist-credentials: false
      - name: Fleet hook tests
        env:
          KERYX_SRC: ${{ github.workspace }}/keryx/src
        run: bash hooks/test_fleet.sh
      # Fork budgets and the screen parser's differential (#492): strace counts
      # processes, and mawk is the awk the parser must agree under.
      - name: Fork budget tests
        run: |
          sudo apt-get update && sudo apt-get install -y strace mawk
          make test-forks
      - name: Wrap-up hook tests
        run: bash hooks/test_wrapup.sh
      - name: Browser closer tests
        run: bash hooks/test_browser.sh
      - name: Launcher tests
        run: |
          command -v tmux >/dev/null || { sudo apt-get update && sudo apt-get install -y tmux; }
          make test-launch FLEET_HEAVY_HELD=1
      - name: Delegate lane tests
        run: make test-delegate FLEET_HEAVY_HELD=1
      - name: Headless runner tests
        run: make test-headless
      - name: Heavy lock release tests
        run: make test-heavy-lock FLEET_HEAVY_HELD=1
      - name: Memory slice tests
        env:
          INPUT_REPEAT: ${{ github.event.inputs.slice_live_repeat }}
        run: |
          repeat="${INPUT_REPEAT:-1}"
          if [[ ! "$repeat" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::slice_live_repeat must be a positive integer, got '$repeat'"
            exit 1
          fi
          env -u BASH_ENV SLICE_LIVE_REPEAT="$repeat" make test-slice FLEET_HEAVY_HELD=1
      - name: Release memory check tests
        run: bash scripts/test_measure_memory.sh
      - name: Windows build stage check tests
        run: bash scripts/test_build_windows.sh
      - name: Fleet suite split tests
        run: python3 -I scripts/test_split_fleet_suite.py
      - name: Perf fixture tests
        run: python3 -I scripts/perf/test_fixture.py
      - name: CI watch tests
        run: python3 -I fleet/test_ci_watch.py
      - name: Screenshot prune tests
        run: python3 -I fleet/test_prune_shots.py
      - name: Briefing mirror refusal tests
        run: bash fleet/test_sync_mirror.sh
      - name: Shell lint
        run: make shellcheck SHELLCHECK=shellcheck FLEET_HEAVY_HELD=1
      - name: Shell lint runner tests
        run: make test-shellcheck
      # The install dir is writable only because the NSIS mode is currentUser;
      # a perMachine build puts it under Program Files. Readings and harness
      # output go to the app data dir and to temp respectively.
      - name: Nothing writes into the install dir
        # Line-granular by nature: it reads one line at a time, and the
        # exemptions are the app data dir and the harness's temp folder, both of
        # which legitimately sit under LocalAppData.
        run: |
          set +e
          hits=$(git grep -niE '(AppData[/\\]+Local[/\\]+|LOCALAPPDATA|local_data_dir).{0,40}klepsydra' \
            -- . ':!*.md' ':!.github/workflows/ci.yml')
          rc=$?
          set -e
          if [ "$rc" -gt 1 ]; then
            echo "::error::the install-directory guard could not run"
            exit 1
          fi
          hits=$(printf '%s' "$hits" | grep -viE 'dev\.ajsoftworks\.klepsydra|Local[/\\]+Temp[/\\]' || true)
          if [ -n "$hits" ]; then
            printf '%s\n' "$hits"
            echo "::error::write a path under the install directory somewhere else"
            exit 1
          fi

  # The whole fleet engine suite in one run (38 min on 11-19): on main, nightly and by hand.
  # A pull request runs it as parallel shards instead (fleet-shard below, #547).
  fleet:
    name: Fleet engine tests
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      # actions/checkout runs `git init`, which prints a hint while Git's
      # default branch name is unset.
      - name: Set Git's default branch name
        run: git config --global init.defaultBranch main
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fleet engine tests
        run: |
          command -v tmux >/dev/null || { sudo apt-get update && sudo apt-get install -y tmux; }
          make test-fleet FLEET_HEAVY_HELD=1

  # Which shards of fleet/test_fleet.sh a change reaches: every shard on main, nightly,
  # by hand, with the ci:full label, or when the suite, lib.sh or this file changes.
  shards:
    name: Pick fleet shards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      all: ${{ steps.pick.outputs.all }}
      run: ${{ steps.pick.outputs.run }}
    steps:
      - name: Set Git's default branch name
        run: git config --global init.defaultBranch main
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request checks out its merge commit; its first parent is the base.
          fetch-depth: 2
          persist-credentials: false
      - name: Pick the shards this change reaches
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          all=$(bash scripts/split-fleet-suite.sh --list)
          echo "all=$all" >>"$GITHUB_OUTPUT"
          run=$all
          # Labels are read live, so "Re-run all jobs" after adding ci:full sees it.
          if [[ $EVENT == pull_request ]] && ! gh api "repos/$REPO/issues/$PR/labels" --jq '.[].name' | grep -qx 'ci:full'; then
            if changed=$(git diff --name-only HEAD^1 HEAD); then
              printf 'changed:\n%s\n' "$changed"
              run=$(printf '%s\n' "$changed" | bash scripts/split-fleet-suite.sh --select)
            else
              echo "::warning::could not list the changed files; running every shard"
            fi
          fi
          echo "shards to run: $run"
          echo "run=$run" >>"$GITHUB_OUTPUT"

  # Every shard reports a status, run or not, so the gate never waits on a missing one.
  fleet-shard:
    name: Fleet shard (${{ matrix.shard }})
    needs: shards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.shards.outputs.all) }}
    steps:
      - name: Is this shard needed
        id: need
        env:
          RUN: ${{ needs.shards.outputs.run }}
          SHARD: ${{ matrix.shard }}
        run: |
          if jq -e --arg s "$SHARD" 'index($s) != null' <<<"$RUN" >/dev/null; then
            echo "run=true" >>"$GITHUB_OUTPUT"
          else
            echo "skipped: this change reaches no file the $SHARD shard runs"
          fi
      - name: Set Git's default branch name
        if: steps.need.outputs.run == 'true'
        run: git config --global init.defaultBranch main
      - name: Checkout code
        if: steps.need.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the shard
        if: steps.need.outputs.run == 'true'
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          command -v tmux >/dev/null || { sudo apt-get update && sudo apt-get install -y tmux; }
          bash scripts/split-fleet-suite.sh
          bash "fleet/tests/$SHARD.sh"

  # Branch protection requires this check by name: it passes only when every half did.
  # always(), not !cancelled(): a skipped job reports success, even as a required check.
  gate:
    name: Gauge logic + statusLine hook
    needs: [test, fleet, shards, fleet-shard]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every half passed
        env:
          SUITES: ${{ needs.test.result }}
          FLEET: ${{ needs.fleet.result }}
          PICK: ${{ needs.shards.result }}
          SHARDS: ${{ needs.fleet-shard.result }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          # A pull request runs the shards instead of the whole suite, so there it is skipped.
          want_fleet=success; [[ $IS_PR == true ]] && want_fleet=skipped
          if [[ $SUITES != success || $FLEET != "$want_fleet" || $PICK != success || $SHARDS != success ]]; then
            echo "::error::other suites: $SUITES; whole fleet suite: $FLEET (want $want_fleet); shard pick: $PICK; fleet shards: $SHARDS"
            exit 1
          fi

  rust:
    name: Rust (fmt + clippy, ${{ matrix.os }})
    # Both targets: the win32 calls behind the drag handle and the topmost
    # re-assert compile only for Windows, and the X11 button query only for
    # Linux, so each half is checked on its own platform.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # actions/checkout runs `git init`, which prints a hint while Git's
      # default branch name is unset.
      - name: Set Git's default branch name
        run: git config --global init.defaultBranch main
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install WebKitGTK and tray headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - name: Add toolchain components
        run: rustup component add clippy rustfmt
      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --all --check
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The job keeps its name: branch protection requires it by that name.
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --workspace
