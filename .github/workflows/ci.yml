name: CI Pipeline
'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  test:
    name: Gauge logic + statusLine hook
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Unit tests (ramp, countdown, staleness, multi-account rows)
        run: node --test src/*.test.js
      # The hook is the only path that publishes usage, so its fixtures cover
      # the shapes that would otherwise fail silently: absent rate_limits, a
      # second account, malformed stdin, an unwritable destination.
      - name: statusLine hook tests
        run: bash statusline/test_statusline.sh
      - name: Shell lint
        run: shellcheck statusline/*.sh scripts/*.sh
      # The install dir is writable only because the NSIS mode is currentUser;
      # a perMachine build puts it under Program Files. Readings and harness
      # output go to the app data dir and to temp respectively.
      - name: Nothing writes into the install dir
        # Line-granular by nature: it reads one line at a time, and the
        # exemptions are the app data dir and the harness's temp folder, both of
        # which legitimately sit under LocalAppData.
        run: |
          set +e
          hits=$(git grep -niE '(AppData[/\\]+Local[/\\]+|LOCALAPPDATA|local_data_dir).{0,40}klepsydra' \
            -- . ':!*.md' ':!.github/workflows/ci.yml')
          rc=$?
          set -e
          if [ "$rc" -gt 1 ]; then
            echo "::error::the install-directory guard could not run"
            exit 1
          fi
          hits=$(printf '%s' "$hits" | grep -viE 'dev\.ajsoftworks\.klepsydra|Local[/\\]+Temp[/\\]' || true)
          if [ -n "$hits" ]; then
            printf '%s\n' "$hits"
            echo "::error::write a path under the install directory somewhere else"
            exit 1
          fi

  rust:
    name: Rust (fmt + clippy)
    # Windows: the overlay is a Windows app, and the win32 calls behind the
    # drag handle and the topmost re-assert only compile for that target.
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Add toolchain components
        run: rustup component add clippy rustfmt
      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
