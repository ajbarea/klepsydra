name: CI Pipeline
'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  test:
    name: Gauge logic + statusLine hook
    runs-on: ubuntu-latest
    steps:
      # actions/checkout runs `git init`, which prints a hint while Git's
      # default branch name is unset.
      - name: Set Git's default branch name
        run: git config --global init.defaultBranch main
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Unit tests (ramp, countdown, reading age, multi-account rows)
        run: node --test src/*.test.js
      # The hook is the only path that publishes usage, so its fixtures cover
      # the shapes that would otherwise fail silently: absent rate_limits, a
      # second account, malformed stdin, an unwritable destination.
      - name: statusLine hook tests
        run: bash statusline/test_statusline.sh
      # The fleet hook is the only writer of a session's state, so its fixtures
      # cover the shapes that would otherwise show a wrong status.
      # keryx names a session's repo the same way the fleet hook does; with
      # its source checked out the parity cases run instead of skipping.
      - name: Checkout keryx (parity source)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ajbarea/keryx
          path: keryx
          persist-credentials: false
      - name: Fleet hook tests
        env:
          KERYX_SRC: ${{ github.workspace }}/keryx/src
        run: bash hooks/test_fleet.sh
      - name: Wrap-up hook tests
        run: bash hooks/test_wrapup.sh
      - name: Launcher tests
        run: |
          command -v tmux >/dev/null || { sudo apt-get update && sudo apt-get install -y tmux; }
          bash hooks/test_launch.sh
      - name: Release memory check tests
        run: bash scripts/test_measure_memory.sh
      - name: Windows build stage check tests
        run: bash scripts/test_build_windows.sh
      - name: Perf fixture tests
        run: python3 -I scripts/perf/test_fixture.py
      - name: Shell lint
        run: shellcheck hooks/*.sh statusline/*.sh scripts/*.sh
      # Logging gates (techne's logging standard): pages log through
      # src/log.js, never console.log, and Python log calls take arguments.
      - name: JS lint (Biome noConsole)
        run: |
          npm install --no-fund --no-audit
          npx biome lint --reporter=github
      - name: Python lint (ruff, logging rules)
        run: pipx run ruff==0.17.3 check --output-format=github
      # The install dir is writable only because the NSIS mode is currentUser;
      # a perMachine build puts it under Program Files. Readings and harness
      # output go to the app data dir and to temp respectively.
      - name: Nothing writes into the install dir
        # Line-granular by nature: it reads one line at a time, and the
        # exemptions are the app data dir and the harness's temp folder, both of
        # which legitimately sit under LocalAppData.
        run: |
          set +e
          hits=$(git grep -niE '(AppData[/\\]+Local[/\\]+|LOCALAPPDATA|local_data_dir).{0,40}klepsydra' \
            -- . ':!*.md' ':!.github/workflows/ci.yml')
          rc=$?
          set -e
          if [ "$rc" -gt 1 ]; then
            echo "::error::the install-directory guard could not run"
            exit 1
          fi
          hits=$(printf '%s' "$hits" | grep -viE 'dev\.ajsoftworks\.klepsydra|Local[/\\]+Temp[/\\]' || true)
          if [ -n "$hits" ]; then
            printf '%s\n' "$hits"
            echo "::error::write a path under the install directory somewhere else"
            exit 1
          fi

  rust:
    name: Rust (fmt + clippy, ${{ matrix.os }})
    # Both targets: the win32 calls behind the drag handle and the topmost
    # re-assert compile only for Windows, and the X11 button query only for
    # Linux, so each half is checked on its own platform.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # actions/checkout runs `git init`, which prints a hint while Git's
      # default branch name is unset.
      - name: Set Git's default branch name
        run: git config --global init.defaultBranch main
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install WebKitGTK and tray headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - name: Add toolchain components
        run: rustup component add clippy rustfmt
      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --all --check
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The job keeps its name: branch protection requires it by that name.
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --workspace
