<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docked gauges</title>
<link rel="stylesheet" href="mock.css">
<link rel="stylesheet" href="strip.css">
<link rel="stylesheet" href="ns.css">
<script src="icons.js"></script>
<script src="readings.js"></script>
<script src="strip.js"></script>
<style>
  /* One gauge component, two homes (Xbox Game Bar's model): docked in the
     wall header while the wall is open, pinned on the desktop while it is closed. */
  .wbar.docked { gap: 18px; flex-wrap: wrap; }
  .dock { display: flex; align-items: center; gap: 6px; margin-right: auto; min-width: 0; }
  .dock .strip { background: var(--page-2); box-shadow: inset 0 0 0 1px var(--line); backdrop-filter: none; }
  .dock .strip .grip { display: none; }
  .dock-toggle { padding: 6px; border-radius: 50%; background: transparent; border-color: transparent; color: var(--ink-dim); }
  .dock-toggle .ico { width: 16px; height: 16px; transform: rotate(180deg); }
  .stage.short { min-height: 0; padding-bottom: 260px; }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 18px; }
  .note-row { display: flex; gap: 10px; align-items: center; color: var(--ink-dim); font-size: 13px; margin-top: 8px; }
  .pinned { position: relative; }
  .pin-mark { position: absolute; right: 8px; top: -9px; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--page-2); color: var(--ink-dim); box-shadow: inset 0 0 0 1px var(--line); }
  .ghost { opacity: 0.35; outline: 1.5px dashed var(--ink-dim); outline-offset: 4px; border-radius: 10px; }
  @media (max-width: 1100px) { .modes { grid-template-columns: 1fr; } }
  @media (max-width: 640px) {
    .wbar.docked .dock { order: 3; flex: 1 1 100%; margin-right: 0; }
    .wbar.docked .tally { margin-right: auto; }
    .dock .strip.double .items { grid-template-columns: auto auto; }
    .stage.short { padding-bottom: 120px; }
  }
</style>
</head>
<body>
<main class="sheet" id="sheet"></main>
<script>
  const A = SNAP.accounts;
  const isPhone = matchMedia("(max-width: 640px)").matches;
  const docked = STRIP.strip("a", isPhone ? "double" : "linear", A);
  const header = (strip) => `
    <div class="wbar docked">
      <div class="tally"><span class="w"><b>6</b>working</span><span><b>0</b>needs you</span></div>
      <div class="dock" role="region" aria-label="Usage, docked in the wall header">${strip}<button class="dock-toggle" aria-label="Hide gauges from the header" title="Hide gauges (Settings › Gauges)"><span class="ico">${ICON.chev}</span></button></div>
      <div class="wbar-right">
        <div class="tools"><button>Ledger</button><button>Queue</button><button>Wrap up…</button></div>
        <span class="split" role="group" aria-label="New session"><button class="primary"><span class="ico">${ICON.claude}</span>New Claude session <span class="mono">RIT</span></button><button class="primary caret" aria-label="Start another kind of session"><span class="ico">${ICON.chev}</span></button></span>
        <button class="gearb" aria-label="Settings"><span class="ico">${ICON.gear}</span></button>
      </div>
    </div>`;
  document.getElementById("sheet").innerHTML = `
<header><h1>Gauges: docked and pinned</h1><p class="trade">One gauge component in two homes, like Xbox Game Bar: docked in the wall header while the wall is open, and the floating strip, pinned on the desktop, while it is closed. While the wall has focus the floating strip hides, so the readings never show twice. The trade: the header gets busier.</p><p class="stamp">Readings: ${SNAP.takenAt}</p></header>

<h2>Wall open: docked in the header</h2>
<p>Strip A's linear layout between the tally and the tools (two rows on a phone). The chevron hides it; Settings › Gauges turns it back on.</p>
<div class="stage short">${header(docked)}</div>

<h2>Wall closed, or the wall in the background: the pinned strip</h2>
<div class="modes">
  <figure>${'<div class="wp ' + (document.documentElement.dataset.theme === "light" ? "wp-light" : "wp-dark") + '"><span class="wp-name">desktop, wall closed</span><div class="pinned">' + STRIP.strip("a", "linear", A) + '<span class="pin-mark">pinned</span></div></div>'}<figcaption class="cap">The floating strip, where it was pinned. Drag it by the grip; Settings resets its position.</figcaption></figure>
  <figure>${'<div class="wp ' + (document.documentElement.dataset.theme === "light" ? "wp-light" : "wp-dark") + '"><span class="wp-name">wall focused</span><div class="ghost">' + STRIP.strip("a", "linear", A) + '</div></div>'}<figcaption class="cap">Hidden while the wall has focus (shown dashed here): the header already shows the same readings.</figcaption></figure>
</div>
<p class="cap" style="margin-top:14px">Settings › Gauges holds both homes: gauges in the wall header (on), the floating strip (on), its own opacity and click-through for when it is pinned, and Reset position.</p>`;
</script>
</body>
</html>
