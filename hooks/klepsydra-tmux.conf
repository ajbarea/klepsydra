# tmux settings for klepsydra's fleet session (socket "klepsydra").
# Claude Code tracks terminal focus through these; set before ~/.tmux.conf so it can opt out.
set -g focus-events on
source-file -q ~/.tmux.conf
# Each window is named for its pane's Claude title; the tab keeps its own.
set -g automatic-rename on
set -g automatic-rename-format "#{pane_title}"
# A claude that fails to start leaves its window open to read.
set -g remain-on-exit failed
# tmux 3.4 crashes when a focus event reaches a pane whose process ended (11-03,
# fixed in 3.5a), so such a pane is started again at once on its saved screen
# (klepsydra-pane-died.sh, #290).
set-hook -g pane-died 'run-shell -b "bash \"$HOME/.claude/klepsydra-pane-died.sh\" \"#{socket_path}\" \"#{hook_pane}\""'
