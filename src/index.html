<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>klepsydra</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="panel" data-state="waiting">
    <div id="grip" title="Drag to move"></div>
    <div id="content">
      <div id="rows"></div>
      <span class="sub" id="empty">waiting for Claude Code</span>
    </div>
  </div>

  <template id="row-tpl">
    <div class="entry">
      <div class="row">
        <span class="label"></span>
        <span class="track"><span class="fill"></span></span>
        <span class="pct"></span>
      </div>
      <span class="sub"></span>
    </div>
  </template>

  <script type="module" src="main.js"></script>
</body>
</html>
