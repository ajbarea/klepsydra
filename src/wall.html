<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#11151b" />
<meta name="apple-mobile-web-app-title" content="klepsydra" />
<title>klepsydra fleet</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="phone/apple-touch-icon.png" />
<link rel="stylesheet" href="fleet/badge.css" />
<link rel="stylesheet" href="fleet/wall.css" />
</head>
<body>
  <header class="bar">
    <div class="lead">
      <div class="tally" role="group" aria-label="Session counts"></div>
      <p class="ring-key" hidden>
        <span class="visually-hidden">Ring key: thick arc, subagent; thin arc, background shell.</span>
        <span class="key" aria-hidden="true"><svg viewBox="0 0 32 18"><path class="agent" d="M 4.5 16 A 11.5 11.5 0 0 1 27.5 16"/></svg>agent</span>
        <span class="key" aria-hidden="true"><svg viewBox="0 0 32 18"><path class="shell" d="M 4.5 16 A 11.5 11.5 0 0 1 27.5 16"/></svg>shell</span>
      </p>
      <div class="tools">
        <button type="button" id="split" aria-pressed="false" title="The wall on the left half of this screen, the fleet terminal on the right" hidden>Split<span class="visually-hidden"> with terminal</span></button>
        <button type="button" id="ledger-open" aria-controls="ledger" aria-expanded="false">Ledger</button>
        <button type="button" id="queue-open" aria-controls="queue" aria-expanded="false" aria-keyshortcuts="Control+Alt+B" title="Queue (Ctrl+Alt+B)">Queue</button>
        <button type="button" id="wrapup-open" aria-haspopup="dialog">Wrap up…</button>
      </div>
      <p class="wrapup-bar" hidden>
        <span class="wrapup-count"></span>
        <span class="wrapup-safe" hidden>Safe to restart</span>
        <button type="button" id="wrapup-stop">Stop wrap-up</button>
        <button type="button" id="end-ready" aria-haspopup="dialog" hidden>End all ready sessions…</button>
      </p>
      <span id="wrapup-note" role="status"></span>
      <p id="link" role="status" hidden></p>
    </div>
    <button type="button" id="new-session" class="primary">+ New session</button>
    <span id="new-note" role="status"></span>
    <span id="split-note" role="status"></span>
<div class="view">
      <fieldset class="density">
        <legend class="visually-hidden">Card density</legend>
        <label><input type="radio" name="density" value="auto" checked /><span>Auto</span></label>
        <label><input type="radio" name="density" value="comfortable" /><span>Comfortable</span></label>
        <label><input type="radio" name="density" value="compact" /><span>Compact</span></label>
      </fieldset>
      <label class="theme-pick" title="Characters: how each session looks"><span class="visually-hidden">Characters</span><select id="theme"></select></label>
    </div>
  </header>
  <main id="main">
  <section class="limits" aria-label="Usage limits" hidden>
    <ul class="limit-rows"></ul>
    <p class="limit-wait" hidden></p>
  </section>
  <h1 id="wall-title" class="visually-hidden">Claude Code sessions</h1>
  <section id="wall" class="wall" aria-labelledby="wall-title" tabindex="-1"></section>
  <section id="empty" class="empty" aria-labelledby="empty-title" hidden>
    <img class="keeper" alt="" />
    <h2 id="empty-title" tabindex="-1">All quiet.</h2>
    <p class="empty-body">Each Claude Code session you start appears here as a card, with its character, its repo and what it's doing.</p>
    <div class="empty-actions">
      <button type="button" id="start-session" class="primary" hidden>Start a session</button>
      <button type="button" id="clear-ended" class="link" hidden></button>
    </div>
    <span id="clear-note" role="status"></span>
  </section>
  </main>
  <p id="live" class="visually-hidden" aria-live="polite"></p>
  <dialog id="portrait" aria-labelledby="portrait-name">
    <img class="full" alt="" />
    <div class="caption">
      <div><h2 id="portrait-name"></h2><p class="epithet"></p><p class="voice"></p></div>
      <form method="dialog"><button type="submit" class="close" data-phone>Close</button></form>
    </div>
  </dialog>

  <dialog id="ledger" class="ledger" aria-labelledby="ledger-title">
    <div class="ledger-resize" role="separator" aria-orientation="vertical" aria-label="Ledger panel width" aria-controls="ledger" tabindex="0"></div>
    <div class="ledger-body">
      <header class="ledger-head">
        <div>
          <h2 id="ledger-title" tabindex="-1">Ledger</h2>
          <p class="ledger-day"></p>
        </div>
        <div class="ledger-tools">
          <div class="ledger-text" role="group" aria-label="Text size">
            <button type="button" class="ledger-smaller" aria-label="Smaller text" title="Smaller text (Ctrl+-)">A&minus;</button>
            <button type="button" class="ledger-reset" title="Reset text size (Ctrl+0)">100%</button>
            <button type="button" class="ledger-larger" aria-label="Larger text" title="Larger text (Ctrl+=)">A+</button>
          </div>
          <button type="button" class="ledger-full" aria-pressed="false" aria-label="Full screen" title="Full screen (Esc to leave)"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg></button>
          <button type="button" class="ledger-close">Close</button>
        </div>
      </header>
      <div class="ledger-content"></div>
      <p class="ledger-live visually-hidden" role="status"></p>
    </div>
  </dialog>
  <button type="button" id="ledger-tab" class="ledger-tab" aria-label="Open Ledger" aria-controls="ledger" aria-expanded="false" title="Open Ledger" hidden>Ledger</button>

  <dialog id="queue" class="queue" aria-labelledby="queue-title">
    <div class="queue-resize" role="separator" aria-orientation="vertical" aria-label="Queue panel width" aria-controls="queue" tabindex="0"></div>
    <div class="queue-body">
      <header class="queue-head">
        <div>
          <h2 id="queue-title" tabindex="-1">Queue</h2>
          <p class="queue-path"></p>
          <p class="queue-kept" hidden></p>
        </div>
        <div class="queue-tools">
          <div class="queue-text" role="group" aria-label="Text size">
            <button type="button" class="queue-smaller" aria-label="Smaller text" title="Smaller text (Ctrl+-)">A&minus;</button>
            <button type="button" class="queue-reset" title="Reset text size (Ctrl+0)">100%</button>
            <button type="button" class="queue-larger" aria-label="Larger text" title="Larger text (Ctrl+=)">A+</button>
          </div>
          <button type="button" class="queue-full" aria-pressed="false" aria-label="Full screen" title="Full screen (Esc to leave)"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg></button>
          <button type="button" class="queue-close">Close</button>
        </div>
      </header>
      <p class="queue-problem" role="status" hidden></p>
      <div class="queue-content"></div>
      <p class="queue-live visually-hidden" role="status"></p>
    </div>
  </dialog>
  <button type="button" id="queue-tab" class="queue-tab" aria-label="Open Queue" aria-controls="queue" aria-expanded="false" aria-keyshortcuts="Control+Alt+B" title="Open Queue (Ctrl+Alt+B)" hidden>Queue</button>

  <div id="session-menu" class="session-menu" role="menu" hidden>
    <button type="button" role="menuitem" tabindex="-1" data-act="interrupt">Interrupt</button>
    <hr role="separator" />
    <button type="button" role="menuitem" tabindex="-1" data-act="end">End session…</button>
  </div>

  <dialog id="end-dialog" class="end-dialog" role="alertdialog" aria-labelledby="end-title" aria-describedby="end-text">
    <div class="end-body">
      <h2 id="end-title"></h2>
      <div id="end-text"><p class="end-what"></p><div class="end-list" hidden></div><p class="end-warn" hidden></p></div>
      <div class="end-buttons">
        <button type="button" class="end-cancel">Cancel</button>
        <button type="button" class="end-confirm"></button>
      </div>
    </div>
  </dialog>

  <audio id="reply-audio" preload="none" hidden></audio>

  <template id="card-tpl">
    <article class="card" tabindex="-1">
      <header>
        <span class="stage" aria-hidden="true"></span>
        <button type="button" class="look" data-phone hidden><img class="figure" alt="" /></button>
        <span class="marks" aria-hidden="true"></span>
        <span class="aura">
          <span class="portrait">
            <svg class="waves" viewBox="-12 -12 104 104" aria-hidden="true"></svg>
            <svg class="ring" viewBox="0 0 80 80" aria-hidden="true">
              <title>Background work: one arc per subagent (thick) or shell (thin)</title>
              <circle class="track" cx="40" cy="40" r="36.5"/><g class="crew"></g>
            </svg>
            <img class="face" alt="" />
            <span class="more" aria-hidden="true" hidden></span>
          </span>
        </span>
        <div class="who"><h2 class="name"></h2><p class="epithet" hidden><svg class="laurel" viewBox="0 0 44 22" aria-hidden="true"><path d="M2.5 20.5C13 18 27 12 40 4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><g fill="currentColor"><ellipse cx="7.8" cy="13.8" rx="3.6" ry="1.45" transform="rotate(-56 7.8 13.8)"/><ellipse cx="10.4" cy="19.8" rx="3.6" ry="1.45" transform="rotate(-16 10.4 19.8)"/><ellipse cx="15.3" cy="11.2" rx="3.6" ry="1.45" transform="rotate(-54 15.3 11.2)"/><ellipse cx="17.9" cy="17.2" rx="3.6" ry="1.45" transform="rotate(-14 17.9 17.2)"/><ellipse cx="22.8" cy="8.0" rx="3.6" ry="1.45" transform="rotate(-58 22.8 8.0)"/><ellipse cx="25.4" cy="14.0" rx="3.6" ry="1.45" transform="rotate(-18 25.4 14.0)"/><ellipse cx="30.3" cy="4.4" rx="3.6" ry="1.45" transform="rotate(-62 30.3 4.4)"/><ellipse cx="32.9" cy="10.4" rx="3.6" ry="1.45" transform="rotate(-22 32.9 10.4)"/><ellipse cx="38.6" cy="4.6" rx="3.4" ry="1.4" transform="rotate(-38 38.6 4.6)"/></g></svg><span></span></p><p class="task"></p></div>
        <p class="pill"><span class="mark"></span><span class="label"></span> <span class="age"></span><span class="when"></span></p>
        <button type="button" class="menu" aria-haspopup="menu" aria-expanded="false" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.5"/><circle cx="8" cy="8" r="1.5"/><circle cx="13" cy="8" r="1.5"/></svg></button>
      </header>
      <div class="meta">
        <p class="where"><span class="repo"></span><span class="branch" hidden></span></p>
        <ul class="also"></ul>
        <span class="also-more" role="img" hidden></span>
        <p class="crew-line" hidden><span class="count"></span><span class="free" hidden>prompt free</span></p>
      </div>
      <p class="ask" hidden><span class="mark"></span><span class="text"><span class="ask-lead"></span><span class="ask-keep"></span></span></p>
      <div class="said">
        <p class="prompt"></p>
        <div class="reply-line">
          <button type="button" class="play" data-phone hidden><svg viewBox="0 0 16 16" aria-hidden="true"><path class="tri" d="M4.5 2.8v10.4L13 8z"/><rect class="sq" x="3.5" y="3.5" width="9" height="9" rx="1"/></svg></button>
          <p class="reply"></p>
        </div>
        <p class="error" hidden></p>
      </div>
      <p class="ledger-line" hidden>
        <span class="receipt"><span class="r-full"></span><span class="r-short" aria-hidden="true"></span></span>
        <span class="partial" role="img" hidden></span>
        <button type="button" class="chip" aria-haspopup="dialog" title="Open the ledger for this session" hidden><span class="c-short" aria-hidden="true"></span><span class="c-full visually-hidden"></span></button>
      </p>
      <p class="wrapup" hidden></p>
      <footer class="actions">
        <span class="foot">
          <span class="updated" hidden></span>
          <span class="note" role="status"></span>
          <span class="ending" hidden>
            <span class="ending-text" aria-hidden="true"></span>
            <span class="ending-live visually-hidden" role="status"></span>
            <button type="button" class="undo">Undo</button>
          </span>
          <span class="why" hidden></span>
          <button type="button" class="clear" hidden title="Removes this card. A session that is still running brings it back at its next event, without its start time or the repos it touched.">Clear</button>
        </span>
        <button type="button" class="jump">Open terminal</button>
        <span class="phone-acts">
          <button type="button" class="unfold" data-phone aria-expanded="false" hidden>Full text<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg></button>
          <a class="remote" target="_blank" rel="noopener noreferrer" hidden>Open in Claude</a>
        </span>
      </footer>
    </article>
  </template>

  <script type="module" src="fleet/wall.js"></script>
</body>
</html>
