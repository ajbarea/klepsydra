[package]
name = "klepsydra-fleet"
version = "0.1.0"
description = "Reads the fleet strip's session files, free of Tauri so it tests anywhere"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8.2"
# The OTLP receiver. Tauri already builds hyper and tokio (through reqwest),
# so serving needs only hyper's server half on top.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["rt", "net", "time", "sync"] }
socket2 = "0.6"
# Ledger days follow the local calendar; bundles tzdb on Windows.
jiff = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock"] }

# The bounded read opens with O_NOFOLLOW | O_NONBLOCK.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
