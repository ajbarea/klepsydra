[package]
name = "klepsydra-fleet"
version = "0.1.0"
description = "Reads the fleet strip's session files, free of Tauri so it tests anywhere"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8.2"
# The OTLP receiver. Tauri already builds hyper and tokio (through reqwest),
# so serving needs only hyper's server half on top.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["rt", "net", "time"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
