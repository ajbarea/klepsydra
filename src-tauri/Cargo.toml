[package]
name = "klepsydra"
version = "0.1.0"
description = "Claude Code usage gauge and fleet wall"
edition = "2021"

[workspace]
members = [".", "fleet"]

# Diagnostics go through the `log` crate, so a stray print fails clippy.
# Tests may print (clippy.toml).
[workspace.lints.clippy]
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2.10"
log = { version = "0.4.34", features = ["kv"] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
klepsydra-fleet = { path = "fleet" }

# The log file test runs the plugin's logger on a mock app.
[dev-dependencies]
tauri = { version = "2", features = ["test", "tray-icon"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.14"

[profile.release]
opt-level = "s"
lto = true
strip = true
