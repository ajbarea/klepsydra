[package]
name = "klepsydra"
version = "0.1.0"
description = "Claude Code usage gauge, always on screen"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.14"

[profile.release]
opt-level = "s"
lto = true
strip = true
